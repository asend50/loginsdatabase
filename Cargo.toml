[package]
name = "loginsdatabase"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
scale = []
default = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }
ureq = { version = "2.9", features = ["json"] }
